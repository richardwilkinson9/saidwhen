name: Archive

# The whole project. Fetch each source, reduce it to text, commit any change.
# Git history is the archive — no database, no credentials, nothing to expire.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every source
        run: node scripts/archive.mjs | tee /tmp/run.log

      - name: Describe and flag whatever changed
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Significance flags are computed deterministically and always run.
          # The plain-English summary needs a model; without one the flags still
          # ship and the summary is simply absent rather than invented.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          fi
          node scripts/summarise.mjs

      - name: Commit whatever moved
        run: |
          git config user.name "saidwhen-archiver"
          git config user.email "archive@saidwhen.org"
          if git diff --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          # Name the documents that actually moved, so the commit log alone
          # reads as a history of what changed and when.
          MOVED=$(git diff --name-only | sed 's|archive/||;s|\.txt$||' | paste -sd ', ' -)
          git add -A
          git commit -m "archive: ${MOVED}"
          git push
          # A commit made with GITHUB_TOKEN does not trigger other workflows,
          # so the site would show yesterday's archive until someone pushed by
          # hand. Kick the build explicitly.
          gh workflow run pages.yml || echo "could not dispatch the site build"
        env:
          GH_TOKEN: ${{ github.token }}
