name: Archive

# The whole project. Fetch each source, reduce it to text, commit any change.
# Git history is the archive — no database, no credentials, nothing to expire.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every source
        run: node scripts/archive.mjs | tee /tmp/run.log

      - name: Commit whatever moved
        run: |
          git config user.name "saidwhen-archiver"
          git config user.email "archive@saidwhen.org"
          if git diff --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          MOVED=$(git diff --name-only | sed 's|archive/||;s|\.txt$||' | paste -sd ', ' -)
          git add -A
          git commit -m "archive: ${MOVED}"

      - name: Describe and flag whatever changed
        # MUST run after the commit. This reads git history to find each change,
        # so a capture sitting only in the working tree is invisible to it — the
        # first version of this workflow ran it before committing and it could
        # never see the very change it had just fetched.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          fi
          node scripts/summarise.mjs
          if ! git diff --quiet; then
            git add data/
            git commit -m "notes: describe and flag the latest changes"
          fi

      - name: Push and rebuild the site
        run: |
          git push
          # A commit made with GITHUB_TOKEN does not trigger other workflows, so
          # the site would show yesterday's archive until someone pushed by hand.
          gh workflow run pages.yml || echo "could not dispatch the site build"
        env:
          GH_TOKEN: ${{ github.token }}
